name: Java CI with Gradle

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    env:
      DEST_PATH: '/home/ec2-user/StudentManagement.jar'

    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          # caches: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0

      - name: Test with Gradle Wrapper
        run: ./gradlew test

      - name: Build with Gradle Wrapper
        run: ./gradlew bootJar
      - name: Set dynamic JAR_PATH
        id: set_jar_path
        run: |
          JAR_FILE=$(find build/libs -name "*.jar" -type f | head -n 1)
          echo "SRC_PATH=$JAR_FILE" >> $GITHUB_ENV
          echo "Generated JAR path: $JAR_FILE"

      - name: SCP Copy Application to EC2 (Secure)
        env:
          PRIVATE_KEY: ${{ secrets.AWS_EC2_PRIVATE_KEY }}
        run: |
          # 秘密鍵をファイルに書き込み、パーミッションを600に設定
          echo "$PRIVATE_KEY" > private_key
          chmod 600 private_key
          
          # SCPでアプリケーションをEC2にコピー
          # ⚠️ SRC_PATHはジョブレベルのenvから、他はSecretsから参照
          scp -o StrictHostKeyChecking=no -i private_key ${{ env.SRC_PATH }} $EC2_USER@$EC2_HOST:${{ env.DEST_PATH }}
          
          # 秘密鍵の後片付け (課題対応)
          rm private_key

      - name: SSH Application Deploy
        uses: appleboy/ssh-action@v0.1.10
        with:
          # SSHアクションはwithブロックでSecretsを参照
          host: ${{ env.EC2_HOST }}
          username: ${{ env.EC2_USER }}
          key: ${{ secrets.AWS_EC2_PRIVATE_KEY }}
          env: DEST_PATH
          script: |
            sudo yum update -y
            if sudo systemctl status StudentManagement 2>&1 | grep "Active: active (running)" ; then
            sudo systemctl restart StudentManagement
            else
            sudo systemctl start StudentManagement
            fi
