name: Java CI with Gradle

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    # ジョブ全体の環境変数を定義
    env:
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USER: 'ec2-user'
      SRC_JAR_PATH: 'build/libs/*.jar'
      DEST_PATH: '/opt/app/StudentManagement.jar'

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Tests
        run: ./gradlew test

      - name: Build and Package Jar (bootJar)
        run: ./gradlew bootJar
        
      - name: Deploy Application to EC2 via SSH/SCP
        uses: appleboy/ssh-action@master
        with:
          host: ${{ env.EC2_HOST }}
          username: ${{ env.EC2_USER }}
          key: ${{ secrets.AWS_EC2_PRIVATE_KEY }}
          source: ${{ env.SRC_JAR_PATH }}
          target: /tmp/
          scp_options: '-o StrictHostKeyChecking=no'
          env: DEST_PATH
          script: |
                    # 1. SCPで転送したファイルを最終デプロイ先に移動
                    JAR_NAME=$(basename $(ls -t /tmp/*.jar | head -n 1))
                    echo "Moving jar $JAR_NAME to ${DEST_PATH}"
                    sudo mv /tmp/$JAR_NAME ${DEST_PATH}
                    
                    # 2. systemdサービスファイルの確認と作成
                    SERVICE_FILE="/etc/systemd/system/StudentManagement.service"
                    if [ ! -f "$SERVICE_FILE" ]; then
                    echo "Creating new Service File: $SERVICE_FILE"
                    # systemdサービスファイルの定義 (ヒアドキュメント EOL は行頭に配置)
                    cat <<EOL | sudo tee "$SERVICE_FILE" > /dev/null
                    [Unit]
                    Description = StudentManagement App
                    
                    [Service]
                    ExecStart = /usr/bin/java -jar ${DEST_PATH}
                    Restart = always
                    Type = simple
                    User = ec2-user
                    Group = ec2-user
                    SuccessExitStatus = 143
                    
                    [Install]
                    WantedBy = multi-user.target
                    EOL
                    fi
            
            # 3. サービスの再読み込み
                    sudo systemctl daemon-reload
            
            # 4. サービスが実行中なら再起動、そうでなければ開始
                    if sudo systemctl is-active --quiet StudentManagement; then
                    echo "Restarting StudentManagement service..."
                    sudo systemctl restart StudentManagement
                    else
                    echo "Starting StudentManagement service..."
                    sudo systemctl start StudentManagement
                    fi
            
            # 5. サービスの状態確認
                    sudo systemctl status StudentManagement

 

